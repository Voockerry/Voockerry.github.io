<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voockerry</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--ink:#1b1e2b;--muted:#5d6377;--brand:#3b4de0}
@media (prefers-color-scheme:dark){:root{--bg:#12141c;--card:#1b1e2a;--ink:#eceef6;--muted:#a3a8bb;--brand:#7d8bff}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding:48px 16px}
main{max-width:640px;margin:0 auto}
h1{font-size:28px;margin:0 0 8px}
p{color:var(--muted);margin:0 0 24px}
a.card{display:block;background:var(--card);border-radius:14px;padding:20px;text-decoration:none;color:var(--ink);border:1px solid rgba(127,127,127,.2)}
a.card:hover,a.card:focus-visible{border-color:var(--brand)}
a.card b{color:var(--brand)}
</style>
</head>
<body>
<main>
<h1>Voockerry</h1>
<p>Навчальні проєкти з дисципліни «Менеджмент в продуктовому ІТ».</p>
<a class="card" href="voocked/"><b>VoockED</b><br>Клікабельний прототип мобільного застосунку для підготовки до НМТ (MVP, лабораторна робота № 3).</a>
</main>
</body>
</html>
